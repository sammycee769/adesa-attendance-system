# Dedicated synthetic database. Never reuse production credentials or volumes.
services:
  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adesa_payments_local
      POSTGRES_USER: payments_local
      POSTGRES_PASSWORD: payments_local_demo_only
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - payments-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_local -d adesa_payments_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  payments-local-data:
