# Production profile.
# Activated with: --spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod)
#
# Startup validation (ProductionSafetyValidator) REFUSES to start this profile
# unless the attendance network restriction is enabled and approved CIDRs are
# configured. This prevents an accidental network-restriction bypass in prod.
#
# It also refuses to start with the development database password, a non-Secure
# session cookie, a placeholder WebAuthn RP ID/origin, or disabled user
# verification.

spring:
  datasource:
    # No default: production must supply a unique secret. A missing value is a
    # startup error, never a fallback to the development password.
    password: ${DB_PASSWORD}

server:
  # Keep NONE so the office-network policy stays in control of client-IP
  # resolution (it only trusts forwarded headers from configured proxies).
  forward-headers-strategy: NONE
  servlet:
    session:
      cookie:
        # HTTPS is mandatory in production, so the session cookie is Secure.
        secure: true

attendance:
  network:
    # Enforcement is never switched on implicitly: the operator must enable it
    # explicitly, and only after the office client address has been verified
    # (README: "Verifying the office address before enforcement is switched on").
    # While it is off this profile refuses to start, so production can never run
    # without the office-network restriction.
    enforcement-enabled: ${ATTENDANCE_NETWORK_ENFORCEMENT_ENABLED:false}
    # The local-development bypass must never be on in production.
    local-development-bypass: false

webauthn:
  # Production requires biometric/PIN verification for the passkey ceremony.
  # WEBAUTHN_RP_ID and WEBAUTHN_ALLOWED_ORIGINS have no safe defaults and are
  # validated at startup: they must describe the deployed HTTPS domain.
  user-verification-required: ${WEBAUTHN_USER_VERIFICATION_REQUIRED:true}

adesa:
  account:
    # APP_PUBLIC_URL has no safe default in production: the validator requires an
    # HTTPS URL that matches an allowed WebAuthn origin, so account-setup and
    # recovery links can never point at localhost or an attacker-controlled host.
    public-url: ${APP_PUBLIC_URL}
  mail:
    # E-mail delivery is required in production: the validator refuses to start
    # without a real SMTP host so the setup/recovery flows cannot silently fail.
    host: ${MAIL_HOST}
    from: ${MAIL_FROM}

management:
  endpoint:
    health:
      show-details: never
